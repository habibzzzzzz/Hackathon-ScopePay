name: Release production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOYMENTS == 'true'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$SUPABASE_DB_URL"
      - run: npx --yes vercel@63.0.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@63.0.1 build --prod --token="$VERCEL_TOKEN"
      - name: Apply versioned database migrations
        run: npx --yes supabase@2.120.0 db push --db-url "$SUPABASE_DB_URL" --yes
      - run: npx --yes vercel@63.0.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
